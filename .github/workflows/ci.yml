name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.1
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Build APK (demo mode)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fishfeed-apk
          path: embed/build/app/outputs/flutter-apk/app-release.apk

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Firebase Arduino Client Library for ESP8266 and ESP32" "ESP32Servo" "RTClib"
      - name: Compile
        run: |
          cp Final_Embed/config.example.h Final_Embed/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32 Final_Embed
